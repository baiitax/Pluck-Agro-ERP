# Supabase CLI configuration for the Pluck Agro ERP.
# Local development:  supabase start
# Apply migrations:   supabase db push  (linked project)  |  supabase migration up (local)
# Regenerate types:   npm run db:types

project_id = "pluck-agro-erp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false # seeds contain local fixtures only; see supabase/seed.sql

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false # accounts are provisioned by administrators

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "20MiB"

[analytics]
enabled = false
